name: Furlough
options:
  bundleIdPrefix: com.zachshort
  deploymentTarget:
    iOS: "26.0"
    macOS: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
  xcodeVersion: "26.6"
  defaultConfig: Debug

settings:
  base:
    DEVELOPMENT_TEAM: X9V4L6HR2R
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "6.0"
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    SWIFT_UPCOMING_FEATURE_MEMBER_IMPORT_VISIBILITY: YES
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    # iPhone only. This project-level value does NOT win on its own: XcodeGen writes its
    # own platform preset at the target level, and target beats project, so every iOS
    # target repeats it below. Removing those repeats silently ships a universal app,
    # which then makes App Store Connect demand a 13-inch iPad screenshot set.
    TARGETED_DEVICE_FAMILY: "1"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
    SWIFT_TREAT_WARNINGS_AS_ERRORS: NO
    CLANG_ENABLE_MODULES: YES

targets:
  Furlough:
    type: application
    platform: iOS
    sources:
      - path: Furlough
      - path: Shared/Core
      - path: Shared/LiveActivity
      - path: Shared/UI
      - path: Shared/PrivacyInfo.xcprivacy
        buildPhase: resources
    entitlements:
      path: Furlough/Furlough.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.developer.nfc.readersession.formats:
          - TAG
        com.apple.security.application-groups:
          - group.com.zachshort.furlough
    info:
      path: Furlough/Info.plist
      properties:
        CFBundleDisplayName: Furlough
        NFCReaderUsageDescription: Furlough reads your tag to weigh anchor and let your apps back in.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSSupportsLiveActivities: true
        NSSupportsLiveActivitiesFrequentUpdates: false
        ITSAppUsesNonExemptEncryption: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIAppFonts:
          - BricolageGrotesque_72pt-Bold.ttf
          - BricolageGrotesque_48pt-SemiBold.ttf
          - BricolageGrotesque_24pt-SemiBold.ttf
          - BricolageGrotesque_24pt-Medium.ttf
          - Onest-Regular.ttf
          - Onest-Medium.ttf
          - Onest-SemiBold.ttf
          - Onest-Bold.ttf
          - GeistMono-Regular.ttf
          - GeistMono-Medium.ttf
          - GeistMono-SemiBold.ttf
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zachshort.furlough
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
    dependencies:
      - target: FurloughMonitor
      - target: FurloughShield
      - target: FurloughWidgets

  FurloughMonitor:
    type: app-extension
    platform: iOS
    sources:
      - path: FurloughMonitor
      - path: Shared/Core
      - path: Shared/PrivacyInfo.xcprivacy
        buildPhase: resources
    entitlements:
      path: FurloughMonitor/FurloughMonitor.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups:
          - group.com.zachshort.furlough
    info:
      path: FurloughMonitor/Info.plist
      properties:
        CFBundleDisplayName: Furlough Monitor
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.deviceactivity.monitor-extension
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).MonitorExtension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zachshort.furlough.monitor
        TARGETED_DEVICE_FAMILY: "1"

  FurloughShield:
    type: app-extension
    platform: iOS
    sources:
      - path: FurloughShield
      - path: Shared/Core
      - path: Shared/PrivacyInfo.xcprivacy
        buildPhase: resources
    entitlements:
      path: FurloughShield/FurloughShield.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups:
          - group.com.zachshort.furlough
    info:
      path: FurloughShield/Info.plist
      properties:
        CFBundleDisplayName: Furlough Shield
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.ManagedSettingsUI.shield-configuration-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShieldExtension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zachshort.furlough.shield
        TARGETED_DEVICE_FAMILY: "1"

  FurloughWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: FurloughWidgets
      - path: Shared/Core
      - path: Shared/LiveActivity
      - path: Shared/UI
      - path: Furlough/Fonts
        buildPhase: resources
      - path: Shared/PrivacyInfo.xcprivacy
        buildPhase: resources
    entitlements:
      path: FurloughWidgets/FurloughWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.zachshort.furlough
    info:
      path: FurloughWidgets/Info.plist
      properties:
        CFBundleDisplayName: Furlough Widgets
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UIAppFonts:
          - BricolageGrotesque_72pt-Bold.ttf
          - BricolageGrotesque_48pt-SemiBold.ttf
          - BricolageGrotesque_24pt-SemiBold.ttf
          - BricolageGrotesque_24pt-Medium.ttf
          - Onest-Regular.ttf
          - Onest-Medium.ttf
          - Onest-SemiBold.ttf
          - Onest-Bold.ttf
          - GeistMono-Regular.ttf
          - GeistMono-Medium.ttf
          - GeistMono-SemiBold.ttf
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zachshort.furlough.widgets
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  # The rules engine on its own. Shared/Core is pure Foundation and already builds for macOS,
  # so the engine can be tested on this Mac with no phone and no host app. ShieldReconciler is
  # left out because it imports ManagedSettings, which does not exist here.
  FurloughCoreTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/Core
      - path: Shared/Core
        excludes:
          - ShieldReconciler.swift
      # The Mac's force-quit grace is pure and decides whether an app is killed under a save
      # dialog, so it is tested here rather than left to the device pass.
      - path: FurloughMac/Model/QuitGrace.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zachshort.furlough.coretests
        MACOSX_DEPLOYMENT_TARGET: "26.0"
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
        SWIFT_EMIT_LOC_STRINGS: NO

  # The Mac. No Screen Time API here (FamilyControls, ManagedSettings and DeviceActivity are
  # unavailable on macOS and Mac Catalyst), so this target shares the rules engine and the look
  # and enforces on its own: see FurloughMac/Model/Enforcer.swift.
  FurloughMac:
    type: application
    platform: macOS
    sources:
      - path: FurloughMac
      - path: Shared/Core
        excludes:
          - ShieldReconciler.swift
          - ActivityNaming.swift
      - path: Shared/UI
      - path: Furlough/Fonts
        type: folder
        buildPhase: resources
      # The watchdog agent. SMAppService.agent looks for it at this exact path inside the
      # bundle, and its Label must match the file name; see FurloughMac/Model/Watchdog.swift.
      - path: FurloughMac/Resources/LaunchAgents/com.zachshort.furlough.mac.watchdog.plist
        buildPhase:
          copyFiles:
            destination: wrapper
            subpath: Contents/Library/LaunchAgents
    entitlements:
      path: FurloughMac/FurloughMac.entitlements
      properties:
        com.apple.security.automation.apple-events: true
        com.apple.security.application-groups:
          - X9V4L6HR2R.com.zachshort.furlough
    info:
      path: FurloughMac/Info.plist
      properties:
        CFBundleDisplayName: Furlough
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        LSApplicationCategoryType: public.app-category.productivity
        NSAppleEventsUsageDescription: Furlough reads the address of the page in front of you so it can block websites outside their windows, and sends a blocked tab to its shield page.
        ATSApplicationFontsPath: Fonts
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_NAME: Furlough
        PRODUCT_BUNDLE_IDENTIFIER: com.zachshort.furlough.mac
        MACOSX_DEPLOYMENT_TARGET: "26.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_APP_SANDBOX: NO
        COMBINE_HIDPI_IMAGES: YES
        ENABLE_PREVIEWS: YES
    dependencies:
      - target: FurloughMacWidgets

  # The Mac's desktop widget: the phone's home-screen widget, through WidgetKit on macOS. It
  # reads the app's store through the App Group, which is why the Mac app carries one too.
  # The group starts with the team identifier, not "group.": on the Mac that kind needs no
  # provisioning profile, so no Mac has to be registered with the team. No Live Activity:
  # ActivityKit does not exist on the Mac; the menu bar item carries the countdown instead.
  FurloughMacWidgets:
    type: app-extension
    platform: macOS
    sources:
      - path: FurloughMacWidgets
      - path: Shared/Core
        excludes:
          - ShieldReconciler.swift
          - ActivityNaming.swift
      - path: Shared/UI
      - path: Furlough/Fonts
        type: folder
        buildPhase: resources
    entitlements:
      path: FurloughMacWidgets/FurloughMacWidgets.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.application-groups:
          - X9V4L6HR2R.com.zachshort.furlough
    info:
      path: FurloughMacWidgets/Info.plist
      properties:
        CFBundleDisplayName: Furlough Widgets
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zachshort.furlough.mac.widgets
        MACOSX_DEPLOYMENT_TARGET: "26.0"
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_APP_SANDBOX: YES
        COMBINE_HIDPI_IMAGES: YES
