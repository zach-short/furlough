name: Furlough
options:
  bundleIdPrefix: com.zachshort
  deploymentTarget:
    iOS: "26.0"
    macOS: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
  xcodeVersion: "26.6"
  defaultConfig: Debug

settings:
  base:
    DEVELOPMENT_TEAM: X9V4L6HR2R
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "6.0"
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    SWIFT_UPCOMING_FEATURE_MEMBER_IMPORT_VISIBILITY: YES
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    # iPhone only. This project-level value does NOT win on its own: XcodeGen writes its
    # own platform preset at the target level, and target beats project, so every iOS
    # target repeats it below. Removing those repeats silently ships a universal app,
    # which then makes App Store Connect demand a 13-inch iPad screenshot set.
    TARGETED_DEVICE_FAMILY: "1"
    MARKETING_VERSION: "1.0.1"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
    SWIFT_TREAT_WARNINGS_AS_ERRORS: NO
    CLANG_ENABLE_MODULES: YES

targets:
  Furlough:
    type: application
    platform: iOS
    sources:
      - path: Furlough
      - path: Shared/Core
      - path: Shared/Intents
      - path: Shared/LiveActivity
      - path: Shared/UI
      - path: Shared/Usage
      - path: Shared/PrivacyInfo.xcprivacy
        buildPhase: resources
    entitlements:
      path: Furlough/Furlough.entitlements
      properties:
        com.apple.developer.family-controls: true
        # iOS 26.4 data access: lets the app read Screen Time's numbers itself and apply a
        # suggested rule in one tap (UsageReader, UsageView). Costs, decided 2026-09-08: the
        # Screen Time prompt becomes all-or-nothing, and Apple honours data access for App
        # Store customers only in the EU. Development builds work anywhere.
        com.apple.developer.family-controls.app-and-website-usage: true
        com.apple.developer.nfc.readersession.formats:
          - TAG
        com.apple.security.application-groups:
          - group.com.zachshort.furlough
        # The Anchor across devices (HANDOFF step 18): one record in the iCloud key-value
        # store, under one identifier on every target that writes or reads it — the app, the
        # monitor, the widgets and the Mac. Automatic signing adds iCloud to the App IDs.
        com.apple.developer.ubiquity-kvstore-identifier: $(TeamIdentifierPrefix)com.zachshort.furlough
    info:
      path: Furlough/Info.plist
      properties:
        CFBundleDisplayName: Furlough
        NFCReaderUsageDescription: Furlough reads your tag to weigh anchor and let your apps back in.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSSupportsLiveActivities: true
        NSSupportsLiveActivitiesFrequentUpdates: false
        ITSAppUsesNonExemptEncryption: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIAppFonts:
          - BricolageGrotesque_72pt-Bold.ttf
          - BricolageGrotesque_48pt-SemiBold.ttf
          - BricolageGrotesque_24pt-SemiBold.ttf
          - BricolageGrotesque_24pt-Medium.ttf
          - Onest-Regular.ttf
          - Onest-Medium.ttf
          - Onest-SemiBold.ttf
          - Onest-Bold.ttf
          - GeistMono-Regular.ttf
          - GeistMono-Medium.ttf
          - GeistMono-SemiBold.ttf
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zachshort.furlough
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
    dependencies:
      - target: FurloughMonitor
      - target: FurloughShield
      - target: FurloughWidgets
      - target: FurloughReport

  FurloughMonitor:
    type: app-extension
    platform: iOS
    sources:
      - path: FurloughMonitor
      - path: Shared/Core
      # The monitor is what is awake at a window's edges, so it is what updates and ends the
      # Live Activity there. It never starts one: only a foreground app may.
      - path: Shared/LiveActivity
      - path: Shared/PrivacyInfo.xcprivacy
        buildPhase: resources
    entitlements:
      path: FurloughMonitor/FurloughMonitor.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups:
          - group.com.zachshort.furlough
        com.apple.developer.ubiquity-kvstore-identifier: $(TeamIdentifierPrefix)com.zachshort.furlough
    info:
      path: FurloughMonitor/Info.plist
      properties:
        CFBundleDisplayName: Furlough Monitor
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.deviceactivity.monitor-extension
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).MonitorExtension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zachshort.furlough.monitor
        TARGETED_DEVICE_FAMILY: "1"

  FurloughShield:
    type: app-extension
    platform: iOS
    sources:
      - path: FurloughShield
      - path: Shared/Core
      # The shield draws the real hourglass (see ShieldExtension.still), so it needs the
      # drawing, the anchor it lays across the neck when the glass is stopped, and the colours
      # it fills with — not the rest of Shared/UI.
      - path: Shared/UI/AnchorMark.swift
      - path: Shared/UI/Hourglass.swift
      - path: Shared/UI/HourglassGeometry.swift
      - path: Shared/UI/HourglassStill.swift
      - path: Shared/UI/Theme.swift
      - path: Shared/PrivacyInfo.xcprivacy
        buildPhase: resources
    entitlements:
      path: FurloughShield/FurloughShield.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups:
          - group.com.zachshort.furlough
    info:
      path: FurloughShield/Info.plist
      properties:
        CFBundleDisplayName: Furlough Shield
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.ManagedSettingsUI.shield-configuration-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShieldExtension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zachshort.furlough.shield
        TARGETED_DEVICE_FAMILY: "1"

  # App Review's automated scan rejected build 202609090423 (2026-09-09, guideline 2.5.1)
  # because this target linked ManagedSettings — Shared/Core imports it for the token types
  # inside the state — while carrying no Family Controls entitlement, which every bundle that
  # links FamilyControls, ManagedSettings or DeviceActivity must. The first answer was to stop
  # linking it: NO_SCREEN_TIME dropped those imports and swapped in
  # Shared/Core/ScreenTimeStandIns.swift. Later the same day the Drop Anchor intent moved into
  # this extension for the Control Center control, and a drop has to apply the shields from
  # whichever process makes it (AnchorDrop → ShieldReconciler) or the control would report
  # "Anchored" with nothing blocked until the app was next opened. So the entitlement is the
  # answer here rather than the stand-ins, which is the other half of what Apple asks for and
  # what scripts/archive.sh checks: link the frameworks and carry the entitlement, or neither.
  # ScreenTimeStandIns.swift is left in place, compiled by nothing, for a target that later
  # needs the state's shape without the frameworks.
  FurloughWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: FurloughWidgets
      - path: Shared/Core
      - path: Shared/LiveActivity
      - path: Shared/UI
      # The Drop Anchor intent runs here for the Control Center control and the widget
      # button, and in the app for Spotlight and Shortcuts: one file, both targets.
      - path: Shared/Intents/DropAnchorIntent.swift
      - path: Furlough/Fonts
        buildPhase: resources
      - path: Shared/PrivacyInfo.xcprivacy
        buildPhase: resources
    entitlements:
      path: FurloughWidgets/FurloughWidgets.entitlements
      properties:
        # Since 2026-09-09: the Drop Anchor intent applies the shields from this process
        # (AnchorDrop → ShieldReconciler), which needs Family Controls here as it does in the
        # monitor. Automatic signing adds the development capability; the distribution
        # profile for this bundle ID needs the distribution entitlement before the next upload.
        com.apple.developer.family-controls: true
        com.apple.security.application-groups:
          - group.com.zachshort.furlough
        com.apple.developer.ubiquity-kvstore-identifier: $(TeamIdentifierPrefix)com.zachshort.furlough
    info:
      path: FurloughWidgets/Info.plist
      properties:
        CFBundleDisplayName: Furlough Widgets
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UIAppFonts:
          - BricolageGrotesque_72pt-Bold.ttf
          - BricolageGrotesque_48pt-SemiBold.ttf
          - BricolageGrotesque_24pt-SemiBold.ttf
          - BricolageGrotesque_24pt-Medium.ttf
          - Onest-Regular.ttf
          - Onest-Medium.ttf
          - Onest-SemiBold.ttf
          - Onest-Bold.ttf
          - GeistMono-Regular.ttf
          - GeistMono-Medium.ttf
          - GeistMono-SemiBold.ttf
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zachshort.furlough.widgets
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  # The rules engine on its own. Shared/Core is pure Foundation and already builds for macOS,
  # so the engine can be tested on this Mac with no phone and no host app. ShieldReconciler is
  # left out because it imports ManagedSettings, which does not exist here.
  # Screen Time's window. iOS hands usage history — per app, per hour, with names — to a report
  # extension and nowhere else: it runs in a process of its own with no network, App Group
  # writes that never land, and terms that forbid getting the numbers out. So the cutback
  # analysis (Shared/Core/UsageAnalysis.swift, pure and tested) runs in here, and its output is
  # pixels the app hosts through DeviceActivityReport. An ExtensionKit extension, embedded
  # under Extensions/, which is what DeviceActivityReportExtension is. No App Group on
  # purpose: there is nothing it could usefully write. Fonts are bundled again because an
  # extension draws from its own bundle.
  FurloughReport:
    type: extensionkit-extension
    platform: iOS
    sources:
      - path: FurloughReport
      - path: Shared/Core
      - path: Shared/Usage
      - path: Shared/UI/Theme.swift
      - path: Furlough/Fonts
        type: folder
        buildPhase: resources
      - path: Shared/PrivacyInfo.xcprivacy
        buildPhase: resources
    entitlements:
      path: FurloughReport/FurloughReport.entitlements
      properties:
        com.apple.developer.family-controls: true
    info:
      path: FurloughReport/Info.plist
      properties:
        CFBundleDisplayName: Furlough Report
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        EXAppExtensionAttributes:
          EXExtensionPointIdentifier: com.apple.deviceactivityui.report-extension
        # The folder above is copied as a folder, so the fonts sit under Fonts/ in the bundle,
        # unlike the phone app, which takes the Furlough folder file by file.
        UIAppFonts:
          - Fonts/BricolageGrotesque_72pt-Bold.ttf
          - Fonts/BricolageGrotesque_48pt-SemiBold.ttf
          - Fonts/BricolageGrotesque_24pt-SemiBold.ttf
          - Fonts/BricolageGrotesque_24pt-Medium.ttf
          - Fonts/Onest-Regular.ttf
          - Fonts/Onest-Medium.ttf
          - Fonts/Onest-SemiBold.ttf
          - Fonts/Onest-Bold.ttf
          - Fonts/GeistMono-Regular.ttf
          - Fonts/GeistMono-Medium.ttf
          - Fonts/GeistMono-SemiBold.ttf
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zachshort.furlough.report
        TARGETED_DEVICE_FAMILY: "1"

  FurloughCoreTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/Core
      - path: Shared/Core
        excludes:
          - ShieldReconciler.swift
      # The Mac's force-quit grace is pure and decides whether an app is killed under a save
      # dialog, so it is tested here rather than left to the device pass. The name migration
      # is here for the same reason: it edits state Zach already has.
      - path: FurloughMac/Model/QuitGrace.swift
      - path: FurloughMac/Model/MacNames.swift
      # The sentence the App Intents answer with. Pure, and listed on its own: the intents
      # beside it need an app to run in, and AppIntents metadata has no business in a test
      # bundle.
      - path: Shared/Intents/StatusSpeech.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zachshort.furlough.coretests
        MACOSX_DEPLOYMENT_TARGET: "26.0"
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
        SWIFT_EMIT_LOC_STRINGS: NO

  # The Mac. No Screen Time API here (FamilyControls, ManagedSettings and DeviceActivity are
  # unavailable on macOS and Mac Catalyst), so this target shares the rules engine and the look
  # and enforces on its own: see FurloughMac/Model/Enforcer.swift.
  FurloughMac:
    type: application
    platform: macOS
    sources:
      - path: FurloughMac
      - path: Shared/Core
        excludes:
          - ShieldReconciler.swift
          - ActivityNaming.swift
      - path: Shared/Intents
      - path: Shared/UI
      - path: Furlough/Fonts
        type: folder
        buildPhase: resources
      # The watchdog agent. SMAppService.agent looks for it at this exact path inside the
      # bundle, and its Label must match the file name; see FurloughMac/Model/Watchdog.swift.
      - path: FurloughMac/Resources/LaunchAgents/com.zachshort.furlough.mac.watchdog.plist
        buildPhase:
          copyFiles:
            destination: wrapper
            subpath: Contents/Library/LaunchAgents
      # What the app and the web filter say to each other over XPC: one file, compiled into both.
      - path: FurloughMacFilter/FilterXPC.swift
    entitlements:
      path: FurloughMac/FurloughMac.entitlements
      properties:
        com.apple.security.automation.apple-events: true
        com.apple.security.application-groups:
          - X9V4L6HR2R.com.zachshort.furlough
        # The same iCloud key-value store as the phone (HANDOFF step 18). Unlike the App
        # Group, iCloud needs a provisioning profile on the Mac, so the build below passes
        # -allowProvisioningDeviceRegistration to register this Mac with the team.
        com.apple.developer.ubiquity-kvstore-identifier: $(TeamIdentifierPrefix)com.zachshort.furlough
        # The web filter (FurloughMacFilter): the app activates the system extension and owns
        # its filter configuration. Both are restricted entitlements, so from here on the app
        # carries a provisioning profile; automatic signing mints a Mac development one, which
        # needs this Mac registered with the team (it is). The value is the plain one, right for
        # development and the App Store; a Developer ID build re-signs with
        # content-filter-provider-systemextension by hand. See HANDOFF step 26.
        com.apple.developer.system-extension.install: true
        com.apple.developer.networking.networkextension:
          - content-filter-provider
    info:
      path: FurloughMac/Info.plist
      properties:
        CFBundleDisplayName: Furlough
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        LSApplicationCategoryType: public.app-category.productivity
        NSAppleEventsUsageDescription: Furlough reads the address of the page in front of you so it can block websites outside their windows, and sends a blocked tab to its shield page.
        NSSystemExtensionUsageDescription: Furlough's web filter refuses connections to a website outside its windows from every app on this Mac, including browsers it cannot read.
        ATSApplicationFontsPath: Fonts
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_NAME: Furlough
        PRODUCT_BUNDLE_IDENTIFIER: com.zachshort.furlough.mac
        MACOSX_DEPLOYMENT_TARGET: "26.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_APP_SANDBOX: NO
        COMBINE_HIDPI_IMAGES: YES
        ENABLE_PREVIEWS: YES
    dependencies:
      - target: FurloughMacWidgets
      - target: FurloughMacFilter

  # The web filter: a network content filter macOS runs as a system extension, dropping every
  # connection to a blocked host from any process — Firefox, a site saved to the Dock as an
  # app, an app that loads a site outside a browser. It sits beside the tab reader in
  # Enforcer, not instead of it: the reader still draws the shield page, the filter closes the
  # holes the reader cannot see. Sandboxed, as every network extension must be; the App Group
  # is only there to prefix its Mach service name. Every decision it makes is
  # Shared/Core/FlowRules.swift, which is pure and tested; the extension is the shell.
  # ENABLE_DEBUG_DYLIB is off because a system extension has to be one Mach-O, and Xcode's
  # Debug split into a stub plus a dylib is not.
  FurloughMacFilter:
    type: system-extension
    platform: macOS
    sources:
      - path: FurloughMacFilter
      - path: Shared/Core/Hosts.swift
      - path: Shared/Core/FlowRules.swift
    entitlements:
      path: FurloughMacFilter/FurloughMacFilter.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.developer.networking.networkextension:
          - content-filter-provider
        com.apple.security.application-groups:
          - X9V4L6HR2R.com.zachshort.furlough
    info:
      path: FurloughMacFilter/Info.plist
      properties:
        CFBundleDisplayName: Furlough Web Filter
        CFBundlePackageType: SYSX
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        # The app carries this key too, and macOS refuses the activation without it *here*:
        # "extensions belonging to the com.apple.system_extension.network_extension category
        # require the presence of the 'NSSystemExtensionUsageDescription' property", thrown
        # before anything is asked of the user, which is why nothing appeared under System
        # Settings > Login Items & Extensions to approve. The string itself is never shown for
        # a network extension — Apple's own engineers say so — but its absence is fatal.
        NSSystemExtensionUsageDescription: Furlough's web filter refuses connections to a website outside its windows from every app on this Mac, including browsers it cannot read.
        # What NEProvider.startSystemExtensionMode reads: the Mach service the extension
        # listens on for the app, and the provider class for the content-filter extension point.
        NetworkExtension:
          NEMachServiceName: X9V4L6HR2R.com.zachshort.furlough.filter
          NEProviderClasses:
            com.apple.networkextension.filter-data: $(PRODUCT_MODULE_NAME).FilterDataProvider
    settings:
      base:
        # A system extension's bundle is named after its identifier, and its module cannot be.
        PRODUCT_NAME: com.zachshort.furlough.mac.filter
        PRODUCT_MODULE_NAME: FurloughMacFilter
        PRODUCT_BUNDLE_IDENTIFIER: com.zachshort.furlough.mac.filter
        MACOSX_DEPLOYMENT_TARGET: "26.0"
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_APP_SANDBOX: YES
        ENABLE_DEBUG_DYLIB: NO

  # The Mac's desktop widget: the phone's home-screen widget, through WidgetKit on macOS. It
  # reads the app's store through the App Group, which is why the Mac app carries one too.
  # The group starts with the team identifier, not "group.": on the Mac that kind needs no
  # provisioning profile, so no Mac has to be registered with the team. No Live Activity:
  # ActivityKit does not exist on the Mac; the menu bar item carries the countdown instead.
  FurloughMacWidgets:
    type: app-extension
    platform: macOS
    sources:
      - path: FurloughMacWidgets
      - path: Shared/Core
        excludes:
          - ShieldReconciler.swift
          - ActivityNaming.swift
      - path: Shared/UI
      - path: Furlough/Fonts
        type: folder
        buildPhase: resources
    entitlements:
      path: FurloughMacWidgets/FurloughMacWidgets.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.application-groups:
          - X9V4L6HR2R.com.zachshort.furlough
    info:
      path: FurloughMacWidgets/Info.plist
      properties:
        CFBundleDisplayName: Furlough Widgets
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zachshort.furlough.mac.widgets
        MACOSX_DEPLOYMENT_TARGET: "26.0"
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_APP_SANDBOX: YES
        COMBINE_HIDPI_IMAGES: YES
