<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Blocked by Furlough</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { color-scheme: dark; }
  html, body { height: 100%; margin: 0; }
  body {
    background: #0F0D0B;
    color: #F5EFE6;
    font: 16px/1.5 -apple-system, "Onest", system-ui, sans-serif;
    display: grid; place-items: center;
    overflow: hidden;
  }
  .wall {
    position: fixed; inset: 0; pointer-events: none;
    background:
      radial-gradient(70vw 42vh at 28vw 104vh, rgba(229,86,61,.6), transparent 62%),
      radial-gradient(60vw 40vh at 90vw -4vh, rgba(245,158,74,.14), transparent 60%);
  }
  main { position: relative; text-align: center; max-width: 34rem; padding: 2rem; }
  svg.glass { display: block; width: 96px; height: 128px; margin: 0 auto 1.6rem; }
  /* The glow breathes as it does in the app, and the lone grain of a window minutes away
     falls, accelerating, once every 3.2 s. Everything else on this page holds still. */
  /* The breath animates the glass's own glow, inside a wrapper that carries the status's
     strength: a keyframe's opacity beats a presentation attribute, so the two have to sit on
     different elements or every status glows alike. */
  .breathing { animation: breathe 4.2s ease-in-out infinite; transform-origin: 60px 118px; }
  @keyframes breathe {
    0%, 100% { opacity: .72; transform: scale(.94); }
    50%      { opacity: 1;   transform: scale(1.06); }
  }
  .grain { animation: fall 3.2s cubic-bezier(.45,0,.9,.55) infinite; }
  @keyframes fall {
    0%       { transform: translateY(0); opacity: 1; }
    72%      { transform: translateY(var(--drop)); opacity: 1; }
    82%      { transform: translateY(calc(var(--drop) - 3px)); opacity: 1; }
    92%, 100% { transform: translateY(var(--drop)); opacity: 0; }
  }
  @media (prefers-reduced-motion: reduce) {
    .breathing, .grain { animation: none; }
    .grain { opacity: 0; }
  }
  .eyebrow { color: #F59E4A; font-size: 11px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; }
  h1 { font-size: 30px; line-height: 1.15; letter-spacing: -.02em; margin: .5rem 0 .6rem; font-weight: 700; }
  p { color: #B8AFA3; margin: 0; }
  .foot { color: #7E766B; font-size: 12px; margin-top: 2.2rem; }
</style>
</head>

<div class="wall"></div>

       re-run that script if the geometry moves. -->

    <ellipse class="grain" id="grain" cx="60" cy="80" rx="1.6" ry="1.6" fill="#FFD59A" style="--drop: 63.5px" visibility="hidden"/>

    <rect class="cap" x="18" y="144" width="84" height="8" rx="4" fill="#F5EFE6" fill-opacity=".92"/>
    <path d="M31,20 C31,34 37,42 45,50" fill="none" stroke="#fff" stroke-opacity=".55" stroke-width="2" stroke-linecap="round"/>
  </svg>
  <div class="eyebrow">Furlough</div>
  <h1 id="t">Blocked by Furlough</h1>
  <p id="s">This site is outside its window.</p>
  <p class="foot">No unblock button. The window opens by itself.</p>
</main>
